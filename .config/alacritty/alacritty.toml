[[keyboard.bindings]]
action = "Copy"
key = "C"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "Paste"
key = "V"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "SpawnNewInstance"
key = "T"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "IncreaseFontSize"
key = "Plus"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "DecreaseFontSize"
key = "Minus"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "Minimize"
key = "N"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "Quit"
key = "Q"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "ToggleFullscreen"
key = "F"
mods = "Control|Shift"

[font]
size = 12

[font.bold]
# family = "Source Code Pro"
family = "Fira Mono"
style = "Bold"

[font.italic]
# family = "Source Code Pro"
family = "Fira Mono"
style = "Italic"

[font.normal]
# family = "Source Code Pro"
family = "Fira Mono"
style = "Regular"

[window]
decorations = "Full"
dynamic_title = true
dynamic_padding = true
decorations_theme_variant = "None"
opacity = 0.90
blur = true

[window.padding]
x = 10
y = 10

[cursor.style]
shape = "Underline"
blinking = "On"

[terminal]
shell = "/bin/zsh" 
