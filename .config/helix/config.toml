theme = "rose_pine"

[editor]
line-number = "relative"
bufferline = "always"
indent-heuristic = "hybrid"
cursorline = true
auto-format = true
text-width = 120
true-color = true

[editor.cursor-shape]
insert = "bar"

[editor.inline-diagnostics]
cursor-line = "hint"
other-lines = "disable"

[editor.soft-wrap]
enable = true

[keys.normal]
C-h = "jump_view_left"
C-l = "jump_view_right"
C-j = "jump_view_down"
C-k = "jump_view_up"
C-pageup = "goto_previous_buffer"
C-pagedown = "goto_next_buffer"
G = "goto_last_line"
"*" = ["move_prev_word_start", "move_next_word_end", "search_selection_detect_word_boundaries"]

[keys.select]
u = "switch_to_lowercase"
U = "switch_to_uppercase"
